<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0a0e1a"/>
<meta name="description" content="Bay Area Soaring — Real-time paragliding & hang gliding weather dashboard for Bay Area flying sites."/>
<title>Bay Area Soaring</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════ */
:root{
  --bg:#0a0e1a;
  --surface:#111827;
  --surface2:#1a2235;
  --surface3:#1e2a40;
  --border:#1f2d45;
  --border2:#2a3a55;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --green:#22c55e;
  --yellow:#eab308;
  --red:#ef4444;
  --orange:#f97316;
  --text:#f1f5f9;
  --text2:#94a3b8;
  --text3:#64748b;
  --glass:rgba(255,255,255,0.04);
  --glass-border:rgba(255,255,255,0.08);
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --transition:0.25s cubic-bezier(0.4,0,0.2,1);
}

/* ═══════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
button{cursor:pointer;font-family:inherit}
iframe{border:none;border-radius:var(--radius-sm);overflow:hidden}

/* ═══════════════════════════════════════════════════
   OFFLINE BANNER
═══════════════════════════════════════════════════ */
#offline-banner{
  display:none;
  position:fixed;top:0;left:0;right:0;z-index:9999;
  background:#7c2d12;
  color:#fed7aa;
  text-align:center;
  padding:10px 20px;
  font-size:14px;
  font-weight:600;
}

/* ═══════════════════════════════════════════════════
   GUST ALERT TOAST
═══════════════════════════════════════════════════ */
#gust-toast{
  display:none;
  position:fixed;top:60px;right:20px;z-index:9998;
  background:#7f1d1d;
  border:1px solid #ef4444;
  border-radius:var(--radius-sm);
  padding:12px 18px;
  color:#fca5a5;
  font-size:13px;
  font-weight:600;
  max-width:320px;
  box-shadow:var(--shadow);
  animation:slideIn 0.3s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* ═══════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════ */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,14,26,0.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  height:60px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{
  display:flex;align-items:center;gap:10px;
  font-size:18px;font-weight:800;letter-spacing:-0.5px;
}
.logo span{font-size:22px}
.header-right{display:flex;align-items:center;gap:12px}
#global-time{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;color:var(--text3);
}
#refresh-btn{
  background:var(--surface2);
  border:1px solid var(--border2);
  color:var(--text2);
  padding:6px 14px;
  border-radius:8px;
  font-size:13px;
  transition:all var(--transition);
}
#refresh-btn:hover{background:var(--surface3);color:var(--text)}
#next-update{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--text3);
}

/* ═══════════════════════════════════════════════════
   SPLIT DASHBOARD LAYOUT (Option D)
═══════════════════════════════════════════════════ */
#app{
  display:flex;
  height:calc(100vh - 60px);
  overflow:hidden;
}

/* LEFT SIDEBAR */
#sidebar{
  width:300px;min-width:260px;
  background:var(--surface);
  border-right:1px solid var(--border);
  overflow-y:auto;
  flex-shrink:0;
  display:flex;flex-direction:column;
}
#sidebar-header{
  padding:16px 16px 8px;
  border-bottom:1px solid var(--border);
}
#sidebar-header h2{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3)}
.site-card{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background var(--transition);
  position:relative;
}
.site-card:hover{background:var(--surface2)}
.site-card.active{
  background:var(--surface3);
  border-left:3px solid var(--accent);
}
.site-card-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px}
.site-card-sub{font-size:12px;color:var(--text3);margin-bottom:8px}
.site-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.condition-badge{
  font-size:11px;font-weight:700;letter-spacing:0.5px;
  padding:3px 9px;border-radius:6px;text-transform:uppercase;
}
.badge-flyable{background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.3)}
.badge-marginal{background:rgba(234,179,8,0.15);color:var(--yellow);border:1px solid rgba(234,179,8,0.3)}
.badge-dangerous{background:rgba(239,68,68,0.15);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
.badge-loading{background:rgba(100,116,139,0.15);color:var(--text3);border:1px solid var(--border)}
.safety-ring{
  font-size:11px;font-weight:700;
  font-family:'JetBrains Mono',monospace;
  color:var(--text2);
}
.gust-alert-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--red);
  box-shadow:0 0 6px var(--red);
  animation:pulse 1.2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.wind-mini{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace}

/* RIGHT DETAIL PANEL */
#detail-panel{
  flex:1;
  overflow-y:auto;
  background:var(--bg);
  padding:24px;
  display:flex;flex-direction:column;gap:20px;
}
.detail-placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--text3);gap:12px;
  font-size:15px;
}
.detail-placeholder span{font-size:48px}

/* ═══════════════════════════════════════════════════
   SITE DETAIL SECTIONS
═══════════════════════════════════════════════════ */
.site-detail-header{
  display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;
  padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
.site-detail-title h1{font-size:24px;font-weight:800;margin-bottom:4px}
.site-detail-title p{font-size:14px;color:var(--text3)}
.detail-badges{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.safety-score-big{
  font-size:28px;font-weight:800;
  font-family:'JetBrains Mono',monospace;
}
.last-updated{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace}

/* AI BRIEFING BOX */
.ai-briefing{
  background:linear-gradient(135deg,rgba(59,130,246,0.08) 0%,rgba(139,92,246,0.08) 100%);
  border:1px solid rgba(59,130,246,0.25);
  border-radius:var(--radius);
  padding:18px 20px;
  position:relative;
  overflow:hidden;
}
.ai-briefing::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),#8b5cf6,var(--accent));
  background-size:200% 100%;
  animation:shimmer 2s linear infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ai-briefing-header{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent2);
}
.ai-briefing-text{font-size:14px;line-height:1.7;color:var(--text)}
.best-window-highlight{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.25);
  border-radius:6px;padding:3px 10px;
  font-weight:700;color:var(--green);font-size:13px;margin-top:8px;
}

/* METRICS GRID */
.metrics-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:12px;
}
.metric-card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(8px);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  transition:transform var(--transition),border-color var(--transition);
  position:relative;
  overflow:hidden;
}
.metric-card:hover{transform:translateY(-2px);border-color:var(--border2)}
.metric-card.alert{
  border-color:rgba(239,68,68,0.5);
  background:rgba(239,68,68,0.06);
}
.metric-card.alert::after{
  content:'⚠';position:absolute;top:8px;right:10px;font-size:14px;color:var(--red);
}
.metric-label{
  font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text3);margin-bottom:6px;
}
.metric-value{
  font-size:28px;font-weight:800;
  font-family:'JetBrains Mono',monospace;
  color:var(--text);line-height:1;
}
.metric-unit{font-size:13px;font-weight:400;color:var(--text3);margin-left:2px}
.metric-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* SKELETON */
.skeleton{
  background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);
  background-size:200% 100%;
  animation:skeleton-anim 1.4s infinite;
  border-radius:6px;
}
@keyframes skeleton-anim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-text{height:14px;margin:6px 0}
.skeleton-block{height:80px;margin:8px 0}

/* SECTION CARD */
.section-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.section-card-header{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;
  user-select:none;
  transition:background var(--transition);
}
.section-card-header:hover{background:var(--surface2)}
.section-card-header h3{
  font-size:13px;font-weight:600;letter-spacing:0.3px;
  display:flex;align-items:center;gap:8px;
}
.section-card-header .chevron{
  font-size:12px;color:var(--text3);
  transition:transform var(--transition);
}
.section-card-header.open .chevron{transform:rotate(180deg)}
.section-card-body{padding:16px 18px;display:none}
.section-card-body.open{display:block}

/* NWS FORECAST */
.forecast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.forecast-item{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px;
}
.forecast-item-name{font-size:12px;font-weight:700;color:var(--accent2);margin-bottom:6px}
.forecast-item-text{font-size:12px;color:var(--text2);line-height:1.5}
.forecast-item-temp{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-top:6px}

/* PILOT REPORTS */
.pilot-report{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;
}
.pilot-report-meta{font-size:11px;color:var(--text3);margin-bottom:4px;font-family:'JetBrains Mono',monospace}
.pilot-report-text{font-size:13px;color:var(--text);line-height:1.5}
.pilot-report-form{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.pilot-report-form textarea{
  background:var(--surface3);border:1px solid var(--border2);
  border-ra
